<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Quem Não Me Segue no Instagram</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 290px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000000;
      color: #f5f5f5;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #262626;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045);
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 3px;
    }
    .info-card {
      background: #121212;
      border: 1px solid #262626;
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.5;
      color: #a8a8a8;
      margin-bottom: 14px;
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .info-item:last-child {
      margin-bottom: 0;
    }
    .btn-action {
      width: 100%;
      background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .btn-action:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .footer {
      text-align: center;
      margin-top: 12px;
      font-size: 11px;
      color: #737373;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Logo" class="logo">
    <div>
      <div class="title">Quem Não Me Segue</div>
      <span class="badge">100% Seguro • Sem Senhas</span>
    </div>
  </div>

  <div class="info-card">
    <div class="info-item">
      <span>🛡️</span>
      <span><strong>Zero Senha:</strong> Usa sua sessão ativa.</span>
    </div>
    <div class="info-item">
      <span>⏱️</span>
      <span><strong>Protegido:</strong> Pausas antibloqueio.</span>
    </div>
    <div class="info-item">
      <span>📊</span>
      <span><strong>Exportação:</strong> Salva em TXT e CSV.</span>
    </div>
  </div>

  <button id="btnMainAction" class="btn-action">
    <span>🔍 Abrir no Instagram</span>
  </button>

  <div class="footer">
    Roda 100% localmente no seu computador
  </div>

  <script src="popup.js"></script>
</body>
</html>
