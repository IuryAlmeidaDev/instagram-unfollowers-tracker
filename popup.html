<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Quem Não Me Segue no Instagram</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 310px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0c0c0d;
      color: #f5f5f5;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }
    ::selection {
      background: rgba(253, 29, 29, 0.35);
      color: #ffffff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #242426;
    }
    .logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }
    .badge {
      display: inline-block;
      background: rgba(253, 29, 29, 0.16);
      color: #ff6e6e;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      margin-top: 3px;
      border: 1px solid rgba(253, 29, 29, 0.35);
      letter-spacing: 0.01em;
    }
    .info-card {
      background: #141416;
      border: 1px solid #262629;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.5;
      color: #d1d5db;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .info-icon {
      width: 16px;
      height: 16px;
      color: #fd1d1d;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-action {
      width: 100%;
      background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.18s ease, transform 0.15s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      margin-bottom: 12px;
    }
    .btn-action:hover {
      opacity: 0.94;
      transform: translateY(-1px);
    }
    .btn-action:active {
      transform: translateY(0);
    }
    .btn-action:focus-visible {
      outline: 2px solid #0095f6;
      outline-offset: 2px;
    }

    /* Pro Card in Popup */
    .pro-card {
      background: #161618;
      border: 1px solid #2e2e33;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .pro-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .pro-title {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .pro-status {
      font-size: 12px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 4px;
      background: #27272a;
      color: #a1a1aa;
      border: 1px solid #3f3f46;
    }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #a3a3a3;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Logo" class="logo">
    <div>
      <div class="title">Quem Não Me Segue</div>
      <span class="badge">100% Seguro • Sem Senhas</span>
    </div>
  </div>

  <div class="info-card">
    <div class="info-item">
      <div class="info-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <span><strong>Zero Senha:</strong> Opera localmente.</span>
    </div>
    <div class="info-item">
      <div class="info-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <span><strong>Protegido:</strong> Pausas antibloqueio.</span>
    </div>
    <div class="info-item">
      <div class="info-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>
      </div>
      <span><strong>Histórico PRO:</strong> Detecta unfollows novos.</span>
    </div>
  </div>

  <button id="btnMainAction" class="btn-action">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <span>Abrir no Instagram</span>
  </button>

  <div class="pro-card" id="popupProCard">
    <div class="pro-header">
      <span class="pro-title">Plano PRO</span>
      <span class="pro-status" id="popupProStatus">FREE</span>
    </div>
    <div id="popupProActionArea" style="margin-top: 10px;">
      <div style="display: flex; gap: 8px;">
        <input type="text" id="popupKeyInput" placeholder="Chave (ex: PRO-VIP-2026)" style="flex: 1; background: #1c1c1f; border: 1px solid #333338; color: #fff; padding: 8px 10px; border-radius: 6px; font-size: 12px; outline: none; min-height: 36px; box-sizing: border-box;">
        <button id="popupActivateBtn" style="background: linear-gradient(135deg, #f59e0b, #d97706); border: none; color: #121214; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 800; cursor: pointer; min-height: 36px; display: inline-flex; align-items: center; justify-content: center;">Ativar</button>
      </div>
      <div id="popupProMsg" style="font-size: 12px; margin-top: 6px; min-height: 16px;"></div>
    </div>

    <!-- Controles PRO: Notificações em Segundo Plano -->
    <div id="popupNotifSection" style="margin-top: 10px; border-top: 1px solid #27272a; padding-top: 10px; display: none;">
      <label style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #e4e4e7; cursor: pointer; user-select: none; min-height: 36px; padding: 2px 0;">
        <span>🔔 Alertas no Desktop (Unfollow)</span>
        <input type="checkbox" id="popupNotifToggle" checked style="accent-color: #f59e0b; cursor: pointer; width: 18px; height: 18px;">
      </label>
      <div style="display: flex; gap: 6px; margin-top: 8px;">
        <button id="popupTestNotifBtn" style="flex: 1; background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; min-height: 36px; display: inline-flex; align-items: center; justify-content: center;">
          Testar Notificação
        </button>
      </div>
    </div>
  </div>

  <div class="footer">
    Roda exclusivamente no seu navegador
  </div>

  <script src="popup.js"></script>
</body>
</html>
